<title>particles.zig</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.172.0/build/three.module.js"}}</script>
<style>
:root { --bg: #0b0d12; --fg: rgba(255,255,255,.88); --dim: rgba(255,255,255,.55); --line: rgba(255,255,255,.12); --accent: #64ffda; color-scheme: dark; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); overflow: hidden; font-family: 'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace; }
#particle-canvas, #particle-overlay { position: fixed; inset: 0; width: 100%; height: 100%; }
.engine { position: fixed; left: 16px; bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); z-index: 2000; display: flex; gap: 10px; align-items: center; font-size: 12px; font-variant-numeric: tabular-nums;
  background: rgba(14,16,22,.55); border: 1px solid var(--line); border-radius: 999px; padding: 6px 6px 6px 14px; backdrop-filter: blur(16px) saturate(180%); -webkit-backdrop-filter: blur(16px) saturate(180%); }
.engine b { color: var(--fg); font-weight: 500; }
.engine span { color: var(--dim); }
.engine button { font: inherit; color: var(--bg); background: var(--accent); border: 0; border-radius: 999px; padding: 6px 12px; cursor: pointer; }
.engine button[data-engine="js"] { background: #ffb86c; }
.engine button:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
</style>
<canvas id="particle-canvas"></canvas>
<canvas id="particle-overlay"></canvas>
<div class="engine"><span>physics <b id="ms">–</b> ms</span><button id="eng" data-engine="wasm">zig/wasm</button></div>
<script>
// demo shim: serve the inlined wasm when the particle system fetches physics.wasm
const PHYSICS_WASM = Uint8Array.from(atob("__WASM__"), (c) => c.charCodeAt(0));
const realFetch = window.fetch.bind(window);
window.fetch = (url, opts) => String(url).endsWith("physics.wasm")
  ? Promise.resolve(new Response(PHYSICS_WASM, { headers: { "content-type": "application/wasm" } }))
  : realFetch(url, opts);
</script>
<script type="module">
__BUNDLE__

const canvas = document.getElementById("particle-canvas");
const overlay = document.getElementById("particle-overlay");
canvas.width = overlay.width = innerWidth;
canvas.height = overlay.height = innerHeight;
const ps = window.particlesInit(canvas, overlay);

// engine toggle + timing, demo only
let wasm = null, avg = 0;
const orig = ps.updateParticles.bind(ps);
ps.updateParticles = (dt) => {
  const t0 = performance.now();
  orig(dt);
  avg = avg * 0.95 + (performance.now() - t0) * 0.05;
};
setInterval(() => { document.getElementById("ms").textContent = avg.toFixed(2); }, 300);
const btn = document.getElementById("eng");
btn.addEventListener("click", () => {
  if (ps.wasmPhysics) {
    wasm = ps.wasmPhysics; ps.wasmPhysics = null;
    ps._connPos = new Float32Array(200000 * 6); ps._connAlpha = new Float32Array(400000); ps._connColor = new Float32Array(200000 * 6);
    btn.dataset.engine = "js"; btn.textContent = "plain js";
  } else if (wasm) {
    ps.wasmPhysics = wasm; btn.dataset.engine = "wasm"; btn.textContent = "zig/wasm";
  }
  avg = 0;
});
</script>
