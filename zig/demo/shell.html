<style>
:root { --bg: #0b0d12; --fg: rgba(255,255,255,.88); --dim: rgba(255,255,255,.55); --line: rgba(255,255,255,.12); --accent: #64ffda; color-scheme: dark; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); overflow: hidden; font-family: 'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace; }
#particle-canvas, #particle-overlay { position: fixed; inset: 0; width: 100%; height: 100%; }

  background: rgba(14,16,22,.55); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; backdrop-filter: blur(16px) saturate(180%); -webkit-backdrop-filter: blur(16px) saturate(180%); }

<canvas id="particle-canvas"></canvas>
<canvas id="particle-overlay"></canvas>
<div class="engine"><span>physics <b id="ms">–</b> ms</span></div>
<script>
// demo shim: serve the inlined wasm when the particle system fetches physics.wasm
const PHYSICS_WASM = Uint8Array.from(atob("__WASM__"), (c) => c.charCodeAt(0));
const realFetch = window.fetch.bind(window);
window.fetch = (url, opts) => /physics(-nosimd)?\.wasm$/.test(String(url))
  ? Promise.resolve(new Response(PHYSICS_WASM, { headers: { "content-type": "application/wasm" } }))
  : realFetch(url, opts);
</script>
<script type="module">
__BUNDLE__

const canvas = document.getElementById("particle-canvas");
const overlay = document.getElementById("particle-overlay");
canvas.width = overlay.width = innerWidth;
canvas.height = overlay.height = innerHeight;
const ps = window.particlesInit(canvas, overlay);

// physics timing, demo only
let avg = 0;
const orig = ps.updateParticles.bind(ps);
ps.updateParticles = (dt) => {
  const t0 = performance.now();
  orig(dt);
  avg = avg * 0.95 + (performance.now() - t0) * 0.05;
};
setInterval(() => { document.getElementById("ms").textContent = avg.toFixed(2); }, 300);
</script>
