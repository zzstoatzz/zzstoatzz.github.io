name: zig physics

on:
  pull_request:
    paths: ["zig/**", "src/particles/**"]
  push:
    branches: [main]
    paths: ["zig/**", "src/particles/**"]

permissions:
  contents: read

jobs:
  zig:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: zig fmt --check zig/src zig/build.zig
      - run: zig build test
        working-directory: zig
      - name: committed wasm is up to date
        run: |
          cd zig && zig build wasm && cd ..
          git diff --exit-code src/particles/physics.wasm src/particles/physics-nosimd.wasm
