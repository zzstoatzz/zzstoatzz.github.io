<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<style>
:root{--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
html,body{margin:0;background:#0b0b03;overscroll-behavior:none}
body{position:relative}
#layer{position:absolute;left:0;width:100%;background:linear-gradient(#f0f 0 6px,#0ff 6px 40px,#222 40px calc(100% - 40px),#ff0 calc(100% - 40px) calc(100% - 6px),#f00 calc(100% - 6px))}
#info{position:absolute;left:12px;top:45%;color:#fff;font:14px monospace;white-space:pre;z-index:2}
</style></head><body><div id="layer"></div><div id="info"></div>
<script>
const v = new URLSearchParams(location.search).get('v') || 'a';
const H = document.documentElement, B = document.body, L = document.getElementById('layer');
// a: lvh doc, no overflow hidden, layer top 0
// b: a + overflow hidden on html/body
// c: a + layer starts at -safe-area-inset-top and is that much taller
// d: c + layer extra 200px above and below (overdraw)
H.style.height = B.style.height = '100lvh';
if (v === 'b') H.style.overflow = B.style.overflow = 'hidden';
L.style.top = v === 'c' ? 'calc(-1 * var(--sat))' : v === 'd' ? '-200px' : '0';
L.style.height = v === 'c' ? 'calc(100lvh + var(--sat))' : v === 'd' ? 'calc(100lvh + 400px)' : '100lvh';
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
const cs = getComputedStyle(document.documentElement);
const t = document.createElement('div'); t.style.cssText = 'position:absolute;top:0;height:100lvh'; B.appendChild(t);
const e2 = document.createElement('div'); e2.style.cssText = 'position:absolute;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)'; B.appendChild(e2);
const s = document.createElement('div'); s.style.cssText = 'position:absolute;top:0;height:100svh'; B.appendChild(s);
function show(){ document.getElementById('info').textContent =
 `variant ${v}\nsafe ${getComputedStyle(e2).paddingTop} / ${getComputedStyle(e2).paddingBottom}\ninnerH ${innerHeight} vv ${visualViewport.height.toFixed(0)}@${visualViewport.offsetTop.toFixed(0)}\nlvh ${t.offsetHeight} svh ${s.offsetHeight}\nscreen ${screen.height}\nscrollY ${scrollY}\nlayer ${JSON.stringify(L.getBoundingClientRect().top)}..${L.getBoundingClientRect().bottom}`; }
show(); setInterval(show, 500);
</script></body></html>
